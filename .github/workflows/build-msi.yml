name: Build MSI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build MSI
        run: npm run build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: veeam-backup-kalkulator-msi
          path: dist/*.msi
          if-no-files-found: error
